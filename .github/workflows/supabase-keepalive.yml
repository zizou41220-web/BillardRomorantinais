name: Supabase Keep-Alive

on:
  schedule:
    # S'exécute tous les 3 jours à midi UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch:

env:
  # Clé "anon" publique (déjà exposée dans le front app.js), pas besoin de secret
  SUPABASE_URL: https://cuszxcwhyfgtvbbylrdx.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1c3p4Y3doeWZndHZiYnlscmR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDg2ODEsImV4cCI6MjEwNDg4NDY4MX0.JJdMg7_h_6szxPzZszcp7l0HOHazgVRX4z-LHsZHfxw

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (vraie requête sur une table)
        run: |
          code=$(curl -s -o response.txt -w "%{http_code}" --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/drinks?select=id&limit=1")
          echo "HTTP $code"
          cat response.txt
          if [ "$code" -ge 400 ]; then exit 1; fi
